name: Upstream candidate capture and replay qualification
on:
  pull_request:
    paths:
      - '.github/workflows/upstream-replay.yml'
      - 'src/cost_to_done/replay.py'
      - 'src/cost_to_done/upstream_replay.py'
      - 'scripts/qualify_upstream_replay.py'
      - 'scripts/prepare_external_controls.py'
      - 'tests/test_upstream_replay.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
          - cpython-statistics-92531
          - cpython-ipaddress-110196
          - cpython-fractions-119189
          - cpython-ipaddress-117566
    env:
      CTD_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned harness and replay runtime
        run: |
          python -m pip install 'harbor==0.27.0'
          python -m pip install -e .
          docker pull 'python:3.12.8-slim-bookworm@sha256:2199a62885a12290dc9c5be3ca0681d367576ab7bf037da120e564723292a2f0'
      - name: Prepare exact upstream sources
        run: python -m scripts.prepare_external_controls "$RUNNER_TEMP/upstream-controls" "$CTD_CASE"
      - name: Collect actual Harbor artifacts and replay pristine tests
        run: >-
          python -m scripts.qualify_upstream_replay
          "$RUNNER_TEMP/upstream-controls" "$CTD_CASE" "$RUNNER_TEMP/upstream-replay"
      - name: Archive redacted replay receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-replay-${{ matrix.case }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-controls/*/provenance.json
            ${{ runner.temp }}/upstream-replay/capture-replay.json
          retention-days: 30
