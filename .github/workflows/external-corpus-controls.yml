name: Public upstream repository controls
on:
  pull_request:
    paths:
      - 'scripts/prepare_external_controls.py'
      - '.github/workflows/external-corpus-controls.yml'
      - 'src/cost_to_done/repository_task.py'
      - 'src/cost_to_done/repository_qualification.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Harbor and local package
        run: |
          python -m pip install 'harbor==0.27.0'
          python -m pip install -e .
      - name: Retrieve pinned public blobs and check local regression controls
        run: python -m scripts.prepare_external_controls "$RUNNER_TEMP/external-controls"
      - name: Run Harbor no-model controls and bind qualification receipts
        run: |
          set -euo pipefail
          for name in cpython-textwrap-139065 cpython-ipaddress-117566; do
            base="$RUNNER_TEMP/external-controls/$name"
            for role in starter reference; do
              cost-to-done validate-repo-task "$base/$role"
              harbor run --path "$base/$role" --agent nop --job-name "$role" --jobs-dir "$base/jobs" --n-concurrent 1 --n-attempts 1
            done
            cost-to-done qualify-repo-task --starter "$base/starter" --reference "$base/reference" --starter-job "$base/jobs/starter" --reference-job "$base/jobs/reference" --output "$base/qualification.json"
            cat "$base/provenance.json" "$base/qualification.json"
          done
      - name: Archive public control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-controls-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/external-controls/*/provenance.json
            ${{ runner.temp }}/external-controls/*/qualification.json
            ${{ runner.temp }}/external-controls/*/starter/ctd-task-manifest.json
            ${{ runner.temp }}/external-controls/*/reference/ctd-task-manifest.json
          retention-days: 30
