name: Gateway network isolation
on:
  push:
    branches: [main]
    paths:
      - "tests/network/**"
      - "scripts/test_gateway_network.sh"
      - "src/cost_to_done/gateway.py"
      - "src/cost_to_done/ledger.py"
      - ".github/workflows/gateway-isolation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Docker Compose availability
        run: docker compose version
      - name: Test isolated network and budget admission with mock provider
        run: bash scripts/test_gateway_network.sh
