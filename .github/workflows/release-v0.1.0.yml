name: v0.1.0 release qualification
on:
  pull_request:
    paths:
      - '.github/workflows/release-v0.1.0.yml'
      - 'docs/release-v0.1.0.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
permissions:
  contents: read
concurrency:
  group: ctd-release-v0.1.0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel and source archive with pinned tooling
        run: |
          set -euo pipefail
          python -m pip install 'build==1.2.2.post1' 'setuptools==80.9.0' 'wheel==0.45.1' 'twine==6.2.0'
          python -m build --no-isolation
          python -m twine check --strict dist/*
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests -v
          python scripts/check_documentation.py
      - name: Install wheel and source archive outside checkout
        run: |
          set -euo pipefail
          wheel="$GITHUB_WORKSPACE/dist/cost_to_done-0.1.0-py3-none-any.whl"
          sdist="$GITHUB_WORKSPACE/dist/cost_to_done-0.1.0.tar.gz"
          for kind in wheel sdist; do
            envdir="$RUNNER_TEMP/ctd-$kind"
            python -m venv "$envdir"
            if [ "$kind" = wheel ]; then
              "$envdir/bin/python" -m pip install --no-index --no-deps "$wheel"
            else
              "$envdir/bin/python" -m pip install 'setuptools==80.9.0' 'wheel==0.45.1'
              "$envdir/bin/python" -m pip install --no-index --no-build-isolation --no-deps "$sdist"
            fi
            (
              mkdir "$RUNNER_TEMP/ctd-user-$kind"
              cd "$RUNNER_TEMP/ctd-user-$kind"
              unset PYTHONPATH OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY || true
              "$envdir/bin/python" -c 'import cost_to_done; assert cost_to_done.__version__ == "0.1.0"'
              "$envdir/bin/cost-to-done" --help
              "$envdir/bin/cost-to-done" demo --output demo.html
              grep -qi synthetic demo.html
              sha256sum demo.html > before.txt
              if "$envdir/bin/cost-to-done" demo --output demo.html; then exit 1; fi
              sha256sum -c before.txt
            )
          done
          (cd dist && sha256sum cost_to_done-0.1.0-py3-none-any.whl cost_to_done-0.1.0.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-v0.1.0-${{ github.run_id }}
          path: |
            dist/cost_to_done-0.1.0-py3-none-any.whl
            dist/cost_to_done-0.1.0.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: qualify
    if: github.repository == 'fraware/cost-to-done' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: release-v0.1.0-${{ github.run_id }}
          path: release
      - name: Publish first alpha release at the qualified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          # Never replace an existing release or tag.
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; inspect manually."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin refs/tags/v0.1.0)" ]; then
            echo "::error::Tag already exists; inspect manually."
            exit 1
          fi
          gh release create v0.1.0 release/cost_to_done-0.1.0-py3-none-any.whl release/cost_to_done-0.1.0.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cost to Done v0.1.0 (alpha)" \
            --notes-file docs/release-v0.1.0.md --prerelease
