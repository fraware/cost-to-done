name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/prepare_site_fonts.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Activate GitHub Pages once in Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
      - name: Prepare verified self-hosted webfonts
        if: steps.pages.outputs.enabled == 'true'
        run: python3 scripts/prepare_site_fonts.py
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Upload static website
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm uploaded artifact has propagated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' \
                2>/dev/null | grep -Eq '^[1-9][0-9]*$'; then
              # The deploy action uses a separate artifact discovery path.
              # Give the GitHub artifact service time to propagate the upload.
              sleep 15
              exit 0
            fi
            sleep 3
          done
          echo "::error::Pages artifact still unavailable after 90 seconds."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
