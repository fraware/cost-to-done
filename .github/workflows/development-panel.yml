name: Matched native development panel (explicitly paid on main)

on:
  pull_request:
    paths:
      - '.github/workflows/development-panel.yml'
      - 'scripts/run_development_panel.py'
      - 'src/cost_to_done/panel*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/development-panel.yml'
permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [allocation-repair, interval-union-repair, dependency-order-repair]
    env:
      CTD_REHEARSAL_API: responses
      CTD_REHEARSAL_REASONING: low
      CTD_REHEARSAL_TASK: ${{ matrix.task }}
      CTD_REHEARSAL_ONLY: '1'
      CTD_OUTPUT_ROOT: ${{ github.workspace }}/runs/rehearsal-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Harbor
        run: |
          python -m pip install 'harbor==0.27.0'
          python -m pip install -e .
          harbor --version
          docker info --format '{{.OSType}}'
      - name: Generate a public, fictional provider secret outside checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' 'ctd-fake-upstream-key-for-tests-12345678' > "$RUNNER_TEMP/ctd-fake-key"
          chmod 600 "$RUNNER_TEMP/ctd-fake-key"
      - name: Execute real live runner with mock-only transport
        run: >-
          python scripts/run_live_rehearsal.py
          "$GITHUB_WORKSPACE" "$CTD_OUTPUT_ROOT" "$RUNNER_TEMP/ctd-fake-key"
      - name: Print scrubbed mock-only Harbor diagnostic on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path(os.environ["CTD_OUTPUT_ROOT"]) / ".sessions/rehearsal-scripted/harbor.driver.log"
          if path.is_file():
              content = path.read_text(encoding="utf-8", errors="replace")[-8000:]
              # The rehearsal uses only a fictional provider key. Suppress
              # other high-entropy strings (e.g. the random gateway token).
              content = re.sub(r"[A-Za-z0-9_\-]{32,}", "[redacted]", content)
              print(content)
          else:
              print("No Harbor process log was created")
          PY
      - name: Audit independent verifier, network proof and metering
        run: python scripts/check_live_rehearsal.py "$CTD_OUTPUT_ROOT"
      - name: Archive fictional trial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-gate-mock-${{ matrix.task }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/runs/rehearsal-ci/.sessions/rehearsal-scripted/evidence/
            ${{ github.workspace }}/runs/rehearsal-ci/.sessions/rehearsal-scripted/run-summary.json
          if-no-files-found: warn
          retention-days: 14

  paid:
    needs: rehearsal
    if: github.repository == 'fraware/cost-to-done' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Harbor and package
        run: |
          python -m pip install 'harbor==0.27.0'
          python -m pip install -e .
          docker info --format '{{.OSType}}'
      - name: Run serial matched panel with eighteen planned episodes
        env:
          CTD_PANEL_AUTHORIZED: '1'
          CTD_OPENAI_SECRET: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python -m scripts.run_development_panel
          --repo-root "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/ctd-panel"
      - name: Archive only redacted plan and trial observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-panel-${{ github.run_id }}
          path: ${{ runner.temp }}/ctd-panel/*.json
          if-no-files-found: warn
          retention-days: 30
