name: Pinned Pi mock protocol probe
on:
  push:
    branches: [main]
    paths:
      - "tests/pi_wire/**"
      - "scripts/test_pi_wire.sh"
      - ".github/workflows/pi-wire.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi-request-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Pi runtime
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - name: Exercise real Pi model client against a local fake API
        run: bash scripts/test_pi_wire.sh
