name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Verify pinned real-model evidence against original source and rate cards
        run: python scripts/check_real_smoke_evidence.py
      - run: cost-to-done reconcile-harbor --help
      - run: |
          python examples/generate_synthetic.py
          cost-to-done validate examples/synthetic-trials.jsonl > /dev/null
          cost-to-done report examples/synthetic-trials.jsonl --output report.html --title Synthetic --demo

      - name: Confirm model-run preflight never needs credentials
        run: >-
          cost-to-done run-harbor --task tasks/allocation-repair
          --model openai/dry-run-placeholder --jobs-dir runs
          --max-turns 5

      - name: Confirm gateway price-schedule planning does not use providers
        run: >-
          cost-to-done gateway-serve
          --price-schedule examples/gateway-price.example.json
          --ledger private/test-gateway.sqlite3 --budget-usd 0.5
      - name: Confirm planning did not create a ledger
        run: test ! -e private/test-gateway.sqlite3

      - name: Verify real-provider gateway planning needs no key and spends nothing
        run: >-
          cost-to-done run-harbor-gateway
          --model test-model-1
          --price-schedule tests/fixtures/mock-price-schedule.json
          --provider-key-file /tmp/no-such-provider-key-file
          --budget-usd 0.25
          --job-name ci-plan-only
      - name: Verify zero-spend planning did not create a run
        run: test ! -e runs/.sessions/ci-plan-only

      - name: Validate declared gateway Compose topology without starting containers
        shell: bash
        run: |
          set -euo pipefail
          echo 'non-secret-ci-placeholder' > "$RUNNER_TEMP/ctd-ci-placeholder-key"
          chmod 600 "$RUNNER_TEMP/ctd-ci-placeholder-key"
          export CTD_REPO_ROOT="$GITHUB_WORKSPACE"
          export CTD_PRICE_FILE="$GITHUB_WORKSPACE/tests/fixtures/mock-price-schedule.json"
          export CTD_PROVIDER_KEY_FILE="$RUNNER_TEMP/ctd-ci-placeholder-key"
          export CTD_EVIDENCE_DIR="$RUNNER_TEMP"
          export CTD_RUN_UID="$(id -u)"
          export CTD_RUN_GID="$(id -g)"
          export CTD_GATEWAY_TOKEN='ci-only-dummy-token-never-used'
          export CTD_BUDGET_USD='0.25'
          docker compose -f experiments/live/base-compose-ci.yaml -f experiments/live/compose.yaml config --format json | python -m cost_to_done.network_audit

      - name: Compare two recorded Harbor controls without credentials or inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private/compare-a/trial private/compare-b/trial
          cp tests/fixtures/harbor-026-oracle.json private/compare-a/trial/result.json
          cp tests/fixtures/harbor-026-oracle.json private/compare-b/trial/result.json
          printf '{"n_total_trials":1}\n' > private/compare-a/result.json
          printf '{"n_total_trials":1}\n' > private/compare-b/result.json
          cost-to-done compare-harbor a=private/compare-a b=private/compare-b --output private/compare.html
          python -c 'from pathlib import Path; h=Path("private/compare.html").read_text(); assert "NO RANKING" in h and "Unavailable" in h'
