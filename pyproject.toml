[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-to-done"
version = "0.1.0"
description = "Open, reproducible accounting for the real cost of verified AI work"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[project.scripts]
cost-to-done = "cost_to_done.cli:main"
realcost = "cost_to_done.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
